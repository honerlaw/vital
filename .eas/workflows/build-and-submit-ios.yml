# Builds the iOS app on EAS (production profile, production EAS environment
# variables) and submits the resulting binary to App Store Connect.
# NOT push-triggered on EAS: GitHub Actions (.github/workflows/release-ios.yml)
# triggers this via `eas workflow:run` after syncing env vars from Doppler, so the
# EAS environment is always up to date before the build starts.
# Prerequisites (one-time, manual) are documented in docs/ios-release.md — until they
# are completed, runs of this workflow are expected to fail.
name: Build and submit iOS

on:
  workflow_dispatch: {}

# Pin every job (build AND submit) to the same Node as local / eas.json's build
# profile. The submit job's `npm ci` validates package-lock.json, and the lock is
# written under npm 11 (Node 24); EAS's default submit image is Node 22 / npm 10,
# which rejects the same lock over pruned optional platform deps (@emnapi/*, see
# npm/cli#4828). eas.json submit profiles don't accept a `node` field, so this is
# the only place to pin it for the submit job.
defaults:
  tools:
    node: 24.13.0

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
