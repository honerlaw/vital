<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Master brand mark for vital. Single design source for every app icon surface.
    Extraction contract (scripts/generate-icons.mjs depends on it):
      - group "bg":    gradient defs + full-bleed rect, direct child of the root
      - group "pulse": white EKG trace + endpoint dot, direct child of the root
    viewBox must stay 0 0 1024 1024.
  -->
  <g id="bg">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1AA862"/>
        <stop offset="0.5" stop-color="#0D8348"/>
        <stop offset="1" stop-color="#06542D"/>
      </linearGradient>
    </defs>
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  </g>
  <g id="pulse" fill="none" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 572H330L420 388L520 690L640 280L720 640L760 572H850"/>
    <circle cx="916" cy="572" r="36" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
