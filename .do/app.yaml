# DigitalOcean App Platform spec for VITAL — a single web-service component that
# builds the Expo Router server export and serves it via server.js.
#
# Env VALUES are managed by Doppler's DigitalOcean App Platform integration; the keys
# are declared here only to pin the scope they require. See docs/deploy-digitalocean.md
# for the Doppler setup and the build-time-vs-runtime caveat.
#
# Validate locally (no provisioning) with:
#   doctl apps spec validate .do/app.yaml --schema-only
name: vital
region: nyc
services:
  - name: web
    environment_slug: node-js
    github:
      # Replace with the GitHub repo connected to your DigitalOcean team.
      repo: your-org/vital
      branch: main
      deploy_on_push: true
    # --include=dev keeps devDependencies (typescript, etc.) installed even though the
    # buildpack sets NODE_ENV=production, so `expo export` has its full toolchain.
    build_command: npm ci --include=dev && npm run export:web
    run_command: npm run serve
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      # EXPO_PUBLIC_* is inlined into the client bundle at BUILD time by `expo export`,
      # so this MUST be RUN_AND_BUILD_TIME. If the value is absent at build, the client
      # silently bakes in `undefined` as the API origin. ${APP_URL} is the app's own URL;
      # see the runbook for the first-deploy build-time caveat and Doppler alternative.
      - key: EXPO_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      # Clerk publishable key — public, but like EXPO_PUBLIC_API_URL it is inlined into the
      # client bundle at BUILD time, so it MUST be RUN_AND_BUILD_TIME (absent at build => the
      # client bakes in a blank key and ClerkProvider errors). Value injected by Doppler.
      - key: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
      # Clerk secret key — server-only, read at runtime by @clerk/backend in requireAuth.
      # Never inlined into the client. SECRET type; value injected by Doppler.
      - key: CLERK_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      # Allowlist of origins authenticateRequest trusts for the web cookie session (subdomain
      # cookie-leak protection). The app's own URL; native Bearer requests are unaffected.
      - key: CLERK_AUTHORIZED_PARTIES
        scope: RUN_TIME
        value: ${APP_URL}
      # DATABASE_URL points the app (and the migrate job below) at DO Managed Postgres.
      # Declared here only to pin RUN_TIME scope; the VALUE is supplied by Doppler's native
      # DO integration — never hardcode the connection string in this file. Runtime-only
      # (the client bundle never sees it), unlike EXPO_PUBLIC_*. See docs/database.md.
      - key: DATABASE_URL
        scope: RUN_TIME

# PRE_DEPLOY migration job. A DO job is its OWN component with its OWN build — it does NOT
# inherit the web service's image or node_modules — so it re-declares github/environment_slug
# and runs its own build. It applies pending schema migrations BEFORE new web containers take
# traffic; a failed migration fails the deploy. The build is deliberately cheap: `npm ci
# --omit=dev` (NOT `npm run export:web`) — the migrate job needs no Expo web build, and
# node-pg-migrate + pg are regular dependencies so they install even with --omit=dev. See
# docs/database.md for the verify-post-deploy caveats (failure semantics, first-deploy Doppler
# timing).
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    environment_slug: node-js
    github:
      # Must match the web service's repo/branch.
      repo: your-org/vital
      branch: main
      deploy_on_push: true
    build_command: npm ci --omit=dev
    run_command: npm run migrate
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
